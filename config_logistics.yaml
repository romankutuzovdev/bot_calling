# Звонок: квалификация потребности в перевозках

scenario: logistics

product:
  name: "автомобильные и сборные перевозки по РФ и СНГ"
  price: "считаем под заявку: FTЛ и сборный груз, обычно ответ по ориентиру в день обращения"
  pitch: >
    Организуем перевозки: сборные и выделенные машины по России и СНГ,
    помощь со складом и документами. Сначала выясняем маршрут и груз,
    потом даём расчёт без обязательств.
  benefits:
    - "быстрый предварительный расчёт"
    - "сборный и целая машина"
    - "фиксируем заявку без оплаты"
    - "можно закрыть разовые и регулярные отгрузки"
  objections:
    expensive: "Понял. Давайте сравним на вашем маршруте — часто выходит выгоднее на сборном. Откуда и куда везёте?"
    later: "Хорошо. Чтобы не потерять слот на расчёт, скажите хотя бы маршрут и примерный объём — займёт полминуты."
    email: "Пришлю КП, но без города отправления и назначения будет вода. Откуда и куда нужна перевозка?"
    think: "Ок. Давайте зафиксируем заявку на расчёт без обязательств — перезвоним с цифрами. Какой маршрут?"
    have_carrier: "Отлично, что уже возите. Мы часто берём пиковые и разовые рейсы, когда у основного нет машины. Бывают такие отгрузки?"

agent:
  name: "Ирина"
  company: "Логистик Лайн"
  language: "ru"
  max_turns: 16
  style: logistics_qualify

opening: >
  Алло, здравствуйте! Ирина, компания Логистик Лайн.
  Уделяете минуту? Уточняю: есть ли у вас сейчас потребность в перевозках грузов?

ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:3b"
  temperature: 0.5
  timeout_sec: 120
  num_predict: 70
  num_ctx: 2048
  keep_alive: "30m"

whisper:
  model_size: "base"
  device: "cpu"
  compute_type: "int8"
  language: "ru"
  cpu_threads: 4

tts:
  engine: "edge"
  voice: "ru-RU-SvetlanaNeural"
  rate: "+8%"
  model: "models/piper/ru_RU-denis-medium.onnx"
  speaker_wav: "voices/my_voice_22k.wav"

audio:
  sample_rate: 16000
  channels: 1
  silence_sec: 0.9
  max_record_sec: 15
  energy_threshold: 0.012
  min_speech_sec: 0.35
  live: true

modes:
  default: "voice"
