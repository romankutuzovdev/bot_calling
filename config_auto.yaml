# Звонок: продажа машинокомплектов из США и Англии

product:
  name: "машинокомплекты из США и Англии"
  price: "от двух тысяч восьмисот долларов за комплект под ключ"
  pitch: >
    Привозим двигатели, коробки и кузовные части с аукционов США и Англии
    под конкретную машину, с фото до оплаты и помощью по документам.
  benefits:
    - "часто дешевле местного рынка"
    - "подбор под марку и год"
    - "фото и договор до оплаты"
    - "можно бесплатно зафиксировать заявку на подбор сегодня"
  objections:
    expensive: "На вашей модели обычно выходит заметно дешевле рынка. Назовите марку и год — прикину ориентир."
    later: "Понимаю. Давайте просто зафиксируем заявку без оплаты, займёт полминуты. Какая машина?"
    email: "Пришлю, но сначала скажите марку и год, иначе будет общая вода. Какая машина?"
    think: "Ок. Чтобы не потерять окно на подбор, оставим бесплатную заявку до завтра? Какая марка?"
    customs: "По документам и пошлине считаем заранее, сюрпризов не делаем. Какой бюджет примерно?"

agent:
  name: "Максим"
  company: "АвтоКит Импорт"
  language: "ru"
  max_turns: 16

opening: >
  Алло, здравствуйте! Максим, АвтоКит Импорт.
  Уделяете минуту? Подскажите, какая у вас машина — марка и год?

ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:3b"
  temperature: 0.55
  timeout_sec: 120
  num_predict: 70
  num_ctx: 2048
  keep_alive: "30m"

whisper:
  # base лучше понимает русский, чем tiny
  model_size: "base"
  device: "cpu"
  compute_type: "int8"
  language: "ru"
  cpu_threads: 4

tts:
  engine: "edge"
  voice: "ru-RU-DmitryNeural"
  rate: "+8%"
  model: "models/piper/ru_RU-denis-medium.onnx"
  speaker_wav: "voices/my_voice_22k.wav"

audio:
  sample_rate: 16000
  channels: 1
  silence_sec: 0.9
  max_record_sec: 15
  energy_threshold: 0.012
  min_speech_sec: 0.35
  live: true

modes:
  default: "voice"
